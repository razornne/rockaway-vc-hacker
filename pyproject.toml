[project]
name = "dd"
version = "0.1.0"
description = "Tech DD + one-page dossier for CEE startups (Rockaway VC Hacker prototype)"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "lxml>=5.0",
    "beautifulsoup4>=4.12",
    "jinja2>=3.1",
    "openai>=1.40",
    "dnspython>=2.6",
]

[project.scripts]
dd = "dd.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: test hits real external services"]
